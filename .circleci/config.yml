version: 2.1

orbs:
  teak: teak/sdk-utils@1
  buildomat: teak/buildomat@0.1
  aws-cli: circleci/aws-cli@5

jobs:
  test:
    parameters:
      xcode-version:
        type: string
        default: "16.4.0"
    macos:
      xcode: << parameters.xcode-version >>
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - ios_setup:
          xcode-version: << parameters.xcode-version >>
      - run:
          name: Run Tests
          command: bundle exec fastlane test
      - store_test_results:
          path: test_output/automated
  test_race:
    parameters:
      xcode-version:
        type: string
        default: "16.4.0"
    macos:
      xcode: << parameters.xcode-version >>
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - ios_setup:
          xcode-version: << parameters.xcode-version >>
      # A red run means a guarded defect is still open: the lane exits nonzero and fails the job.
      # store_* run `when: always` so the results and artifacts still upload on that red.
      - run:
          name: Run Race Tripwires (ThreadSanitizer)
          command: bundle exec fastlane test_race
      - store_test_results:
          path: test_output/race
          when: always
      - store_artifacts:
          path: test_output/race
          when: always
  build:
    parameters:
      xcode-version:
        type: string
        default: "16.4.0"
    macos:
      xcode: << parameters.xcode-version >>
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - ios_setup:
          xcode-version: << parameters.xcode-version >>
      - run:
          name: Ensure IPHONEOS_DEPLOYMENT_TARGET is 9.0
          command: ./deployment_target_check.rb
      - run:
          name: Build Teak SDK
          command: ./compile_xc_framework
      - persist_to_workspace:
          root: .
          paths:
            - TeakFramework/Teak.xcframework.zip
            - TeakFramework/Teak.xcframework.zip.sha512
            - TeakFramework/TeakExtension.xcframework.zip
            - TeakFramework/TeakExtension.xcframework.zip.sha512
            - TeakFramework/TeakResources.bundle.zip
            - TeakFramework/TeakResources.bundle.zip.sha512
            - TeakFramework/Info.plist
  changelog_check:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Check changelog fragments
          command: |
            yarn install --frozen-lockfile
            yarn changelog check

  tag_build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - teak/tag-promote

  deploy_versioned:
    docker:
      - image: cimg/base:current
    steps:
      - fetch_release_artifacts
      - upload_sdk:
          prefix: ios
          versioned: true
      - update_framework:
          push: true

  deploy_latest:
    docker:
      - image: cimg/base:current
    steps:
      - fetch_release_artifacts
      - upload_sdk:
          prefix: ios
          versioned: false

  # Dry run of deploy_versioned: same upload and framework steps, but the S3 prefix is a literal
  # ios/dev/ (meant to be expired by a bucket lifecycle rule) and nothing is pushed to the framework repo's main
  # or tags.
  deploy_dev:
    docker:
      - image: cimg/base:current
    steps:
      - fetch_release_artifacts
      - upload_sdk:
          prefix: ios/dev
          versioned: true
      - update_framework:
          push: false

  # Dry run of publish_pod: lints the podspec against the framework repo contents that
  # deploy_versioned would push, without pushing anything or publishing.
  pod_lint:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - checkout
      - ruby_setup
      - run: git fetch --tags
      - attach_workspace:
          at: workspace/
      - update_framework:
          push: false
      - run:
          name: Lint podspec
          command: |
            gem install cocoapods
            cd teak-ios-framework
            pod lib lint Teak.podspec --allow-warnings

  docs:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install Doxygen
          command: sudo apt-get update && sudo apt-get install -y doxygen
      - run:
          name: Build API docs
          command: yarn && yarn docs

  publish_pod:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - checkout
      - ruby_setup
      - run: git fetch --tags
      - run:
          name: Publish to CocoaPods trunk
          command: |
            gem install cocoapods
            VERSION=$(git describe --tags --always --match '[0-9]*')
            git clone --branch "${VERSION}" --depth 1 git@github.com:GoCarrot/teak-ios-framework.git teak-ios-framework
            cd teak-ios-framework
            pod trunk push Teak.podspec --allow-warnings

workflows:
  version: 2

  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * 1-5"
          filters:
            branches:
              only:
                - develop
    jobs:
      - test:
          context:
            - iOS-Build
      - build:
          context:
            - iOS-Build
      - docs

  nightly-latest:
    triggers:
      - schedule:
          cron: "0 0 * * 1-5"
          filters:
            branches:
              only:
                - master
    jobs:
      - test:
          context:
            - iOS-Build
      - build:
          context:
            - iOS-Build
      - docs

  un-tagged-build:
    jobs:
      - test:
          context:
            - iOS-Build
          filters:
            tags:
              ignore: /.*/
      # Runs the race regression guard under TSan on every commit. Green in normal operation; a red
      # means a real regression — the fix it guards was reverted, or a new race landed. Non-gating
      # here (not a dependency of tag_build), so it doesn't block promote-tag creation; the release
      # gate lives in the tagged-build workflow below, where a red run blocks the deploy.
      - test_race:
          context:
            - iOS-Build
          filters:
            tags:
              ignore: /.*/
      - build:
          context:
            - iOS-Build
          filters:
            tags:
              ignore: /.*/
      - changelog_check:
          filters:
            tags:
              ignore: /.*/
      - tag_build:
          requires:
            - test
            - build
            - changelog_check
          filters:
            tags:
              ignore: /.*/
      # Dry runs of the release steps after build. Parallel to tag_build and not required by
      # it: a failure turns the workflow red but doesn't block promote-tag creation.
      - deploy_dev:
          context:
            - AWS-OIDC-Role
          requires:
            - build
          filters:
            tags:
              ignore: /.*/
      - pod_lint:
          requires:
            - build
          filters:
            tags:
              ignore: /.*/
      - docs:
          filters:
            tags:
              ignore: /.*/

  tagged-build:
    jobs:
      - test:
          context:
            - iOS-Build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - build:
          context:
            - iOS-Build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      # Release gate: the race guard must be green before a version deploys. A red run — a reverted
      # fix or a new race — blocks deploy_versioned (and the whole deploy chain below), so a version
      # can't ship while a guarded race is open.
      - test_race:
          context:
            - iOS-Build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - deploy_versioned:
          context:
            - AWS-OIDC-Role
          requires:
            - test
            - build
            - test_race
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - hold:
          type: approval
          requires:
            - test
            - build
            - test_race
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - deploy_latest:
          context:
            - AWS-OIDC-Role
          requires:
            - hold
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - publish_pod:
          context:
            - CocoaPods
          requires:
            - deploy_latest
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/

commands:
  fetch_release_artifacts:
    description: "Fetch tags, the build workspace, and AWS credentials for a deploy job"
    steps:
      - checkout
      - run: git fetch --tags
      - aws-cli/install
      - attach_workspace:
          at: workspace/
      - buildomat/aws-oidc-assume
  # Uploads the built SDK artifacts to s3://teak-build-artifacts/<prefix>/. The prefix is always
  # a literal at the call site, never a variable, so a dev run can't write a release key.
  upload_sdk:
    description: "Upload SDK artifacts to S3"
    parameters:
      prefix:
        type: string
      versioned:
        type: boolean
    steps:
      - run:
          name: Upload SDK to S3
          command: |
            if [ "<< parameters.versioned >>" = "true" ]; then
              SFX="-$(git describe --tags --always --match '[0-9]*')"
            else
              SFX=""
            fi
            DEST="s3://teak-build-artifacts/<< parameters.prefix >>"
            W=workspace/TeakFramework
            aws s3 cp $W/Teak.xcframework.zip ${DEST}/Teak${SFX}.xcframework.zip --acl public-read
            aws s3 cp $W/Teak.xcframework.zip.sha512 ${DEST}/Teak${SFX}.xcframework.zip.sha512 --acl public-read
            aws s3 cp $W/TeakExtension.xcframework.zip ${DEST}/TeakExtension${SFX}.xcframework.zip --acl public-read
            aws s3 cp $W/TeakExtension.xcframework.zip.sha512 ${DEST}/TeakExtension${SFX}.xcframework.zip.sha512 --acl public-read
            # Localized strings for notification action buttons (consumed by teak-unity)
            aws s3 cp $W/TeakResources.bundle.zip ${DEST}/TeakResources${SFX}.bundle.zip --acl public-read
            aws s3 cp $W/TeakResources.bundle.zip.sha512 ${DEST}/TeakResources${SFX}.bundle.zip.sha512 --acl public-read
            # Notification content extension category config, generated by
            # import_notification_categories (consumed by teak-unity)
            aws s3 cp $W/Info.plist ${DEST}/Info${SFX}.plist --acl public-read
  # Stages the built SDK into a teak-ios-framework clone and commits and tags it locally. With
  # push: true, publishes main and the tags; with push: false, only a `git push --dry-run` of
  # main, which still proves the key can write to the remote.
  update_framework:
    description: "Update teak-ios-framework with the built SDK"
    parameters:
      push:
        type: boolean
    steps:
      - run:
          name: Update teak-ios-framework
          command: |
            VERSION=$(git describe --tags --always --match '[0-9]*')
            git clone git@github.com:GoCarrot/teak-ios-framework.git teak-ios-framework
            cd teak-ios-framework
            git config user.email "team@teak.io"
            git config user.name "Teak CI"
            rm -rf Teak.xcframework TeakExtension.xcframework
            unzip -o ../workspace/TeakFramework/Teak.xcframework.zip -d .
            unzip -o ../workspace/TeakFramework/TeakExtension.xcframework.zip -d .
            cp ../workspace/TeakFramework/Teak.xcframework.zip .
            cp ../workspace/TeakFramework/Teak.xcframework.zip.sha512 .
            cp ../workspace/TeakFramework/TeakExtension.xcframework.zip .
            cp ../workspace/TeakFramework/TeakExtension.xcframework.zip.sha512 .
            cp ../workspace/TeakFramework/Info.plist .
            sed -i.bak "s/spec.version      = \".*\"/spec.version      = \"${VERSION}\"/" Teak.podspec
            rm Teak.podspec.bak
            git add -A
            git commit -m "${VERSION}"
            git tag "${VERSION}"
            if [ "<< parameters.push >>" = "true" ]; then
              git push origin main
              git push --tags
            else
              git push --dry-run origin main
              echo "dry run: nothing pushed"
            fi
  # Runs the Ruby named in .ruby-version. The image's rbenv doesn't have it, so it is built
  # once per image and cached; the job fails unless that is the Ruby actually running.
  ruby_setup:
    description: "Run the Ruby pinned in .ruby-version"
    parameters:
      xcode-version:
        type: string
        default: "16.4.0"
    steps:
      - restore_cache:
          key: v2-ruby-<< parameters.xcode-version >>-{{ checksum ".ruby-version" }}
      - run:
          name: Ruby Setup
          command: |
            want=$(sed 's/^ruby-//' .ruby-version)
            versions="$(rbenv root)/versions"
            cache="$HOME/ruby-cache"
            if [ -d "${cache}/${want}" ]; then
              mkdir -p "${versions}"
              cp -R "${cache}/${want}" "${versions}/${want}"
            else
              brew update --quiet || true
              brew upgrade ruby-build || true
              # Link the image's own openssl: ruby-build would otherwise link the newest
              # brew openssl, which a cache-restored Ruby won't find on a fresh image.
              brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
              RUBY_CONFIGURE_OPTS="--with-openssl-dir=$(brew --prefix openssl@3)" rbenv install -s "${want}"
              mkdir -p "${cache}"
              cp -R "${versions}/${want}" "${cache}/${want}"
            fi
            # Later steps pick this Ruby up through BASH_ENV.
            shims="$(rbenv root)/shims"
            echo "export RBENV_VERSION=${want}; export PATH=${shims}:\$PATH" >> "$BASH_ENV"
            export RBENV_VERSION="${want}" PATH="${shims}:${PATH}"
            rbenv rehash
            ruby -v
            ruby -v | grep -q "^ruby ${want} "
            ruby -ropenssl -ryaml -e 1
      - save_cache:
          paths:
            - ~/ruby-cache
          key: v2-ruby-<< parameters.xcode-version >>-{{ checksum ".ruby-version" }}
  #
  # Common setup
  #
  ios_setup:
    description: "iOS Common Setup"
    parameters:
      xcode-version:
        type: string
        default: "16.4.0"
    steps:
      - checkout
      - ruby_setup:
          xcode-version: << parameters.xcode-version >>
      - run:
          name: Fetch Tags
          command: git fetch --tags
      - restore_cache:
          key: v3-{{ checksum "setup" }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}-{{ .Environment.HOMEBREW_VERSION }}
      - run:
          name: Ruby Gems
          command: |
            bundle config set --local path vendor/bundle
            bundle check || bundle install
      - save_cache:
          paths:
            - /usr/local/Homebrew/
            - ~/Library/Caches/Homebrew
            - vendor/bundle
            - Sample/vendor/bundle
          key: v3-{{ checksum "setup" }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}-{{ .Environment.HOMEBREW_VERSION }}
      - run:
          name: Import Teak Notification Category Data
          command: ./import_notification_categories notification_categories.csv
  #
  # Trigger a playbook build
  #
  build_antora_playbook:
    description: "Build Teak Docs"
    parameters:
      build_type:
        type: enum
        default: "development"
        enum: ["development", "production"]
    steps:
      - run:
          name: Trigger Antora Playbook Build
          command: |
            curl --location --request POST 'https://circleci.com/api/v2/project/github/GoCarrot/antora-ui-teak/pipeline' \
            --header 'Content-Type: application/json' \
            -u "${CIRCLE_API_TOKEN}" \
            -d '{
              "parameters": {
                "build_type": "<< parameters.build_type >>"
              }
            }'
