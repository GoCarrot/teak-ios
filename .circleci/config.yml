version: 2.1

# Setup config: decides which pipeline to run, then continues with continue_config.yml.
# `code-changed` is true when the branch differs from its base in anything other than the doc paths
# in the mapping below, so a new directory or a .circleci edit runs CI by default. The diff is
# branch-vs-base, not per push: a docs-only push on top of a code change still runs everything.
setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          base-revision: 4.3-stable
          config-path: .circleci/continue_config.yml
          mapping: |
            (?!docs/|\.claude/|[^/]*\.md\z).+ code-changed true
          filters:
            tags:
              only: /.*/
