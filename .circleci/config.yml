version: 2.1

orbs:
  teak: teak/sdk-utils@1
  buildomat: teak/buildomat@0.1
  aws-cli: circleci/aws-cli@5

jobs:
  test:
    parameters:
      xcode-version:
        type: string
        default: "27.2.0"
    macos:
      xcode: << parameters.xcode-version >>
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - ios_setup
      - run:
          name: Run Tests
          command: bundle exec fastlane test
      - store_test_results:
          path: test_output/automated
  test_race:
    parameters:
      xcode-version:
        type: string
        default: "27.2.0"
    macos:
      xcode: << parameters.xcode-version >>
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - ios_setup
      # A red run means a guarded defect is still open: the lane exits nonzero and fails the job.
      # store_* run `when: always` so the results and artifacts still upload on that red.
      - run:
          name: Run Race Tripwires (ThreadSanitizer)
          command: bundle exec fastlane test_race
      - store_test_results:
          path: test_output/race
          when: always
      - store_artifacts:
          path: test_output/race
          when: always
  build:
    parameters:
      xcode-version:
        type: string
        default: "27.2.0"
    macos:
      xcode: << parameters.xcode-version >>
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - ios_setup
      - run:
          name: Toolchain
          command: xcodebuild -version && xcodebuild -showsdks
      - run:
          name: Build Teak SDK
          command: ./compile_xc_framework 2>&1 | tee build.log
      - run:
          name: Producer diagnostics
          when: always
          command: |
            mkdir -p probe_out
            grep -E 'warning:|error:' build.log | sort | uniq -c | sort -rn > probe_out/producer-diagnostics.txt || true
            cp build.log probe_out/ || true
            for f in TeakFramework/Teak.xcframework/ios-arm64/Teak.framework/Teak TeakFramework/TeakExtension.xcframework/ios-arm64/TeakExtension.framework/TeakExtension; do
              echo "== $f"; vtool -show-build "$f"; plutil -p "$(dirname $f)/Info.plist" | grep -E 'MinimumOS|DTSDK|DTXcode'
            done > probe_out/producer-vtool.txt 2>&1 || true
            cat probe_out/producer-diagnostics.txt probe_out/producer-vtool.txt
      - store_artifacts:
          path: probe_out
      - persist_to_workspace:
          root: .
          paths:
            - TeakFramework/Teak.xcframework.zip
            - TeakFramework/Teak.xcframework.zip.sha512
            - TeakFramework/TeakExtension.xcframework.zip
            - TeakFramework/TeakExtension.xcframework.zip.sha512
            - TeakFramework/TeakResources.bundle.zip
            - TeakFramework/TeakResources.bundle.zip.sha512
            - TeakFramework/Info.plist
  consumer:
    parameters:
      xcode-version:
        type: string
        default: "27.2.0"
      framework-source:
        type: enum
        enum: ["shipped", "built"]
    macos:
      xcode: << parameters.xcode-version >>
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - ios_setup
      - when:
          condition:
            equal: ["built", << parameters.framework-source >>]
          steps:
            - attach_workspace:
                at: workspace/
            - run: mkdir -p fw && cd fw && unzip -q ../workspace/TeakFramework/Teak.xcframework.zip && unzip -q ../workspace/TeakFramework/TeakExtension.xcframework.zip
      - when:
          condition:
            equal: ["shipped", << parameters.framework-source >>]
          steps:
            - run: |
                mkdir -p fw && cd fw
                curl -sfO https://teak-build-artifacts.s3.amazonaws.com/ios/Teak-4.3.17.xcframework.zip
                curl -sfO https://teak-build-artifacts.s3.amazonaws.com/ios/TeakExtension-4.3.17.xcframework.zip
                unzip -q Teak-4.3.17.xcframework.zip && unzip -q TeakExtension-4.3.17.xcframework.zip
      - run:
          name: Simulator runtimes
          command: xcrun simctl list runtimes
      - run:
          name: Consumer (legacy app delegate)
          command: probe/consumer/run.sh fw legacy probe_out
          no_output_timeout: 20m
      - run:
          name: Consumer (UIScene)
          when: always
          command: probe/consumer/run.sh fw scene probe_out
          no_output_timeout: 20m
      - store_artifacts:
          path: probe_out
  tag_build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - teak/tag-promote

  deploy_versioned:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: git fetch --tags
      - aws-cli/install
      - attach_workspace:
          at: workspace/
      - buildomat/aws-oidc-assume
      - run:
          name: Upload SDK to S3
          command: |
            VERSION=$(git describe --tags --always)
            aws s3 cp workspace/TeakFramework/Teak.xcframework.zip s3://teak-build-artifacts/ios/Teak-${VERSION}.xcframework.zip --acl public-read
            aws s3 cp workspace/TeakFramework/Teak.xcframework.zip.sha512 s3://teak-build-artifacts/ios/Teak-${VERSION}.xcframework.zip.sha512 --acl public-read
            aws s3 cp workspace/TeakFramework/TeakExtension.xcframework.zip s3://teak-build-artifacts/ios/TeakExtension-${VERSION}.xcframework.zip --acl public-read
            aws s3 cp workspace/TeakFramework/TeakExtension.xcframework.zip.sha512 s3://teak-build-artifacts/ios/TeakExtension-${VERSION}.xcframework.zip.sha512 --acl public-read
            # Localized strings for notification action buttons (consumed by teak-unity)
            aws s3 cp workspace/TeakFramework/TeakResources.bundle.zip s3://teak-build-artifacts/ios/TeakResources-${VERSION}.bundle.zip --acl public-read
            aws s3 cp workspace/TeakFramework/TeakResources.bundle.zip.sha512 s3://teak-build-artifacts/ios/TeakResources-${VERSION}.bundle.zip.sha512 --acl public-read
            # Notification content extension category config, generated by
            # import_notification_categories (consumed by teak-unity)
            aws s3 cp workspace/TeakFramework/Info.plist s3://teak-build-artifacts/ios/Info-${VERSION}.plist --acl public-read
      - run:
          name: Update teak-ios-framework
          command: |
            VERSION=$(git describe --tags --always)
            git clone git@github.com:GoCarrot/teak-ios-framework.git teak-ios-framework
            cd teak-ios-framework
            git config user.email "team@teak.io"
            git config user.name "Teak CI"
            rm -rf Teak.xcframework TeakExtension.xcframework
            unzip -o ../workspace/TeakFramework/Teak.xcframework.zip -d .
            unzip -o ../workspace/TeakFramework/TeakExtension.xcframework.zip -d .
            cp ../workspace/TeakFramework/Teak.xcframework.zip .
            cp ../workspace/TeakFramework/Teak.xcframework.zip.sha512 .
            cp ../workspace/TeakFramework/TeakExtension.xcframework.zip .
            cp ../workspace/TeakFramework/TeakExtension.xcframework.zip.sha512 .
            cp ../workspace/TeakFramework/Info.plist .
            sed -i "s/spec.version      = \".*\"/spec.version      = \"${VERSION}\"/" Teak.podspec
            git add -A
            git commit -m "${VERSION}"
            git tag "${VERSION}"
            git push origin main
            git push --tags

  deploy_latest:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: git fetch --tags
      - aws-cli/install
      - attach_workspace:
          at: workspace/
      - buildomat/aws-oidc-assume
      - run:
          name: Upload SDK to S3
          command: |
            aws s3 cp workspace/TeakFramework/Teak.xcframework.zip s3://teak-build-artifacts/ios/Teak.xcframework.zip --acl public-read
            aws s3 cp workspace/TeakFramework/Teak.xcframework.zip.sha512 s3://teak-build-artifacts/ios/Teak.xcframework.zip.sha512 --acl public-read
            aws s3 cp workspace/TeakFramework/TeakExtension.xcframework.zip s3://teak-build-artifacts/ios/TeakExtension.xcframework.zip --acl public-read
            aws s3 cp workspace/TeakFramework/TeakExtension.xcframework.zip.sha512 s3://teak-build-artifacts/ios/TeakExtension.xcframework.zip.sha512 --acl public-read
            # Localized strings for notification action buttons (consumed by teak-unity)
            aws s3 cp workspace/TeakFramework/TeakResources.bundle.zip s3://teak-build-artifacts/ios/TeakResources.bundle.zip --acl public-read
            aws s3 cp workspace/TeakFramework/TeakResources.bundle.zip.sha512 s3://teak-build-artifacts/ios/TeakResources.bundle.zip.sha512 --acl public-read
            # Notification content extension category config, generated by
            # import_notification_categories (consumed by teak-unity)
            aws s3 cp workspace/TeakFramework/Info.plist s3://teak-build-artifacts/ios/Info.plist --acl public-read

  publish_pod:
    macos:
      xcode: "14.3.1"
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    steps:
      - checkout
      - run: git fetch --tags
      - run:
          name: Publish to CocoaPods trunk
          command: |
            gem install cocoapods
            VERSION=$(git describe --tags --always)
            git clone --branch "${VERSION}" --depth 1 git@github.com:GoCarrot/teak-ios-framework.git teak-ios-framework
            cd teak-ios-framework
            pod trunk push Teak.podspec --allow-warnings

workflows:
  version: 2
  xcode27-probe:
    jobs:
      - test:
          context:
            - iOS-Build
      - test_race:
          context:
            - iOS-Build
      - build:
          context:
            - iOS-Build
      - consumer:
          name: consumer-shipped-4.3.17
          framework-source: shipped
          context:
            - iOS-Build
      - consumer:
          name: consumer-xcode27-built
          framework-source: built
          requires:
            - build
          context:
            - iOS-Build

commands:
  #
  # Common setup
  #
  ios_setup:
    description: "iOS Common Setup"
    steps:
      - checkout
      - run:
          name: Fetch Tags
          command: git fetch --tags
      - restore_cache:
          key: v2-{{ checksum "setup" }}-{{ checksum "Gemfile.lock" }}-{{ .Environment.HOMEBREW_VERSION }}
      - run:
          name: Probe ruby (image lacks .ruby-version's 3.2.2)
          command: |
            rbenv versions || true
            v=$(rbenv versions --bare | grep -E '^3\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            echo "using ruby $v"; echo "$v" > .ruby-version
            gem install bundler -v 2.4.22 --no-document
      - run:
          name: Ruby Gems
          command: |
            bundle config set --local path vendor/bundle
            bundle check || bundle install
      - save_cache:
          paths:
            - /usr/local/Homebrew/
            - ~/Library/Caches/Homebrew
            - vendor/bundle
            - Sample/vendor/bundle
          key: v2-{{ checksum "setup" }}-{{ checksum "Gemfile.lock" }}-{{ .Environment.HOMEBREW_VERSION }}
      - run:
          name: Import Teak Notification Category Data
          command: ./import_notification_categories notification_categories.csv
      - run:
          name: Probe-only deployment target override (Xcode 27 floor is 15.0)
          command: |
            grep -rl 'IPHONEOS_DEPLOYMENT_TARGET = ' --include=project.pbxproj . | grep -v vendor/ | while read f; do
              sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' "$f"; echo "overrode $f"
            done
            git diff --stat
  #
  # Trigger a playbook build
  #
  build_antora_playbook:
    description: "Build Teak Docs"
    parameters:
      build_type:
        type: enum
        default: "development"
        enum: ["development", "production"]
    steps:
      - run:
          name: Trigger Antora Playbook Build
          command: |
            curl --location --request POST 'https://circleci.com/api/v2/project/github/GoCarrot/antora-ui-teak/pipeline' \
            --header 'Content-Type: application/json' \
            -u "${CIRCLE_API_TOKEN}" \
            -d '{
              "parameters": {
                "build_type": "<< parameters.build_type >>"
              }
            }'
