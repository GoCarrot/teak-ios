enhancement:
  - "The SDK is now built with Xcode 16.4. The minimum supported iOS version is unchanged."
bug:
  - "``openSettingsAppToThisAppsSettings`` now opens Settings.app in apps built with the iOS 18 SDK and later. It previously did nothing in those apps."
  - "Fixed a crash when resolving a Teak link whose response was not UTF-8 encoded and had no iOS path."
  - "Fixed the session being reported as ended, with no resume, when the app returned to the foreground immediately after backgrounding."
  - "Fixed ``launchLink`` being missing from reward link launch data when the link was resolved by the Teak server."
  - "``startedLiveActivity`` now skips a push token that matches the last one sent for that activity, so repeated ``pushTokenUpdates`` values are not sent to Teak again."
  - "Calling ``startedLiveActivity`` again for a token that was already sent now returns the original call's operation, so a failed send is reported to both callers. A cancelled call no longer prevents the next one from sending."
