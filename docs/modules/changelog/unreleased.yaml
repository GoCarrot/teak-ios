enhancement:
  - "The SDK is now built with Xcode 16.4. The minimum supported iOS version is unchanged."
bug:
  - "``openSettingsAppToThisAppsSettings`` now opens Settings.app in apps built with the iOS 18 SDK and later. It previously did nothing in those apps."
  - "Fixed a crash when resolving a Teak link whose response was not UTF-8 encoded and had no iOS path."
  - "Fixed the session being reported as ended, with no resume, when the app returned to the foreground immediately after backgrounding."
  - "Fixed ``launchLink`` being missing from reward link launch data when the link was resolved by the Teak server."
  - "``startedLiveActivity`` now skips a push token that matches the last one sent for that activity, so repeated ``pushTokenUpdates`` values are not sent to Teak again. A repeat returns the original call's operation, so it reports that send's result."
  - "Fixed a memory leak where launch data was never freed after a deep link updated it."
  - "Fixed a memory leak where operations returned by live activity, channel and category state, and local notification scheduling calls were never freed."
  - "``forEndpoint:withPayload:`` on ``TeakOperation`` now sends the payload it is given. It previously sent an empty payload."
  - "An exception raised while a ``TeakOperation`` runs, or reading ``result`` on one that was canceled before it ran, now gives an error ``TeakOperationResult`` instead of raising when ``result`` is read."
