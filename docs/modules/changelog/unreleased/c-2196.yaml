bug:
  - "Apps using a UIKit scene delegate (``UIWindowSceneDelegate``) now get Teak session pause/resume on background/foreground, and the custom-scheme opens, launch URLs and universal links UIKit delivers to the scene delegate now reach Teak. Previously only SwiftUI scene apps were hooked. Scene delegates chosen at runtime in ``application:configurationForConnectingSceneSession:options:`` are covered too. Scene delegates get every URL, including the ones Teak handled; the new ``UIOpenURLContext.teakHandled`` property tells them apart in ``scene:openURLContexts:`` and ``scene:willConnectToSession:options:``."
